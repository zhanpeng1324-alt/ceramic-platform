server.port=8080
spring.profiles.default=dev

# 排除 Redisson 官方自动配置：它会在启动时强制连接 Redis，连不上整个应用起不来。
# 改用 RedissonConfig 中的惰性 RedissonClient：启动不依赖 Redis，连不上自动降级
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ceramic?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterSetResults=utf8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
mybatis.configuration.map-underscore-to-camel-case=true

# Redis（缓存 + Redisson 分布式锁/布隆过滤器）：默认连 docker compose 的 ceramic-redis 容器（Redis 7，宿主端口 6380）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
# 短超时：Redis 不可用时毫秒级失败并降级直查 MySQL，避免每次请求挂起数秒
spring.data.redis.timeout=1000
spring.data.redis.connect-timeout=1000

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
server.tomcat.uri-encoding=UTF-8
spring.jackson.default-property-inclusion=non_null
spring.jackson.charset=UTF-8

jwt.secret=${JWT_SECRET:ceramic-platform-dev-jwt-secret-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# DeepSeek: API Key 仅通过环境变量 DEEPSEEK_API_KEY 注入，禁止写入代码仓库或前端。
# （历史版本曾把 key 写进本文件默认值，已移除；请在系统环境变量中配置 DEEPSEEK_API_KEY）
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.timeout-seconds=30
deepseek.max-message-length=2000
deepseek.max-history-messages=12
deepseek.max-tokens=500
deepseek.rate-limit-per-minute=20

# 订单超时自动取消：主链路为 RabbitMQ 延迟消息（下单即发 TTL 消息，到期经死信交换机消费取消），
# 定时任务降频为兜底扫描，防止消息丢失导致订单永远停留在待支付。
order.pay-timeout-minutes=30
order.pay-timeout-check-ms=600000

# RabbitMQ（docker compose 启动的 ceramic-rabbitmq 容器）
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
